function handleClick(e) {

  else if (action === 'theme') { state.theme = state.theme === 'dark' ? 'light' : 'dark'; refreshAfterToggle(); toast(`${state.theme === 'dark' ? 'Dark' : 'Light'} theme enabled`); }
