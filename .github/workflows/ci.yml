name: DevShow CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test API, visibility, security, and frontend
        run: npm test
      - name: Test desktop launcher adapter
        run: npm run test:desktop
