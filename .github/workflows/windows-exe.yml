name: DevShow Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v3.0.*']
permissions:
  contents: write
concurrency:
  group: devshow-windows-exe
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run test:desktop
        env:
          DB_PATH: ${{ runner.temp }}\devshow-check.sqlite
      - run: node --build-sea dist/sea-config.json
      - name: Validate standalone EXE and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:DB_PATH = Join-Path $env:RUNNER_TEMP 'devshow-exe-check.sqlite'
          & .\dist\DevShow-Desktop.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Standalone EXE self-test failed.' }
          if ((Get-Item .\dist\DevShow-Desktop.exe).Length -lt 1000000) { throw 'Executable unusually small.' }
          $sha = (Get-FileHash .\dist\DevShow-Desktop.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  DevShow-Desktop.exe" | Set-Content -Encoding ascii .\dist\DevShow-Desktop.exe.sha256
          & .\dist\DevShow-Desktop.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Standalone EXE version check failed.' }
      - name: Publish current desktop download
        if: startsWith(github.ref, 'refs/heads/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'desktop-latest'
          gh release view $tag --repo '${{ github.repository }}' 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target '${{ github.sha }}' --repo '${{ github.repository }}' --title 'DevShow Desktop (latest verified)' --notes 'Current verified Windows desktop build. Standalone EXE; local SQLite storage. Download DevShow-Desktop.exe.' --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Could not create latest desktop release.' }
          }
          gh release upload $tag .\dist\DevShow-Desktop.exe .\dist\DevShow-Desktop.exe.sha256 --clobber --repo '${{ github.repository }}'
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload Windows executable.' }
          gh release edit $tag --repo '${{ github.repository }}' --notes "Verified source commit: ${{ github.sha }}. Standalone Windows executable with local SQLite storage."
      - name: Publish versioned desktop release
        if: startsWith(github.ref, 'refs/tags/v3.0.')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          gh release view $tag --repo '${{ github.repository }}' 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo '${{ github.repository }}' --title "DevShow $tag Desktop" --notes 'Standalone Windows desktop application; private SQLite storage.'
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release.' }
          }
          gh release upload $tag .\dist\DevShow-Desktop.exe .\dist\DevShow-Desktop.exe.sha256 --clobber --repo '${{ github.repository }}'
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload Windows executable.' }
