name: DevShow Windows executable
on:
  workflow_dispatch:
  push:
    tags: ['v2.5.*']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run test:desktop
        env:
          DB_PATH: ${{ runner.temp }}\devshow-verify.sqlite
      - run: node --build-sea dist/sea-config.json
      - name: Verify standalone EXE
        shell: pwsh
        run: |
          $env:DB_PATH = Join-Path $env:RUNNER_TEMP 'devshow-exe-selftest.sqlite'
          & .\dist\DevShow-Desktop.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item .\dist\DevShow-Desktop.exe).Length -lt 1000000) { throw 'Executable unusually small.' }
      - name: Publish direct executable
        if: startsWith(github.ref, 'refs/tags/v2.5.')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create '${{ github.ref_name }}' '.\dist\DevShow-Desktop.exe' --repo '${{ github.repository }}' --title 'DevShow ${{ github.ref_name }} Desktop' --notes 'Standalone Windows desktop companion with private SQLite storage.'
